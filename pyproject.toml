[project]
name = "threecx"
authors = [
    { name = "Verre & Transparence", email = "gauthier@de-chezelles.com"}
]
description = "Intégration de la téléphonie 3CX : identification de l'appelant, journal d'appels, transcriptions, click-to-call"
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
dependencies = [
    # "frappe~=15.0.0" # Installed and managed by bench.
]

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.bench.frappe-dependencies]
frappe = ">=15.0.0"
erpnext = ">=15.0.0"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["F", "E", "W", "I", "UP", "B", "RUF"]
ignore = [
    "E101", # indentation contains mixed spaces and tabs
    "E501", # line too long
    "W191", # indentation contains tabs
]

[tool.ruff.format]
quote-style = "double"
indent-style = "tab"
docstring-code-format = true
